<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripSafe — Pre-Travel Attendance Risk Projector</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React and ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
              950: '#1e1b4b',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .pulse-glow {
      box-shadow: 0 0 15px rgba(79, 70, 229, 0.35);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col">
  <div id="root"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- INITIAL SEED DATA ---
    const DEFAULT_SUBJECTS = [
      { id: 1, name: 'Data Structures & Algorithms', code: 'CS301', classesConducted: 75, classesAttended: 60, minAttendancePercentage: 75, color: '#4f46e5' },
      { id: 2, name: 'Database Management Systems', code: 'CS302', classesConducted: 55, classesAttended: 48, minAttendancePercentage: 75, color: '#0891b2' },
      { id: 3, name: 'Operating Systems', code: 'CS303', classesConducted: 65, classesAttended: 52, minAttendancePercentage: 75, color: '#059669' },
      { id: 4, name: 'Computer Networks', code: 'CS304', classesConducted: 50, classesAttended: 39, minAttendancePercentage: 75, color: '#d97706' },
      { id: 5, name: 'Software Engineering', code: 'CS305', classesConducted: 45, classesAttended: 37, minAttendancePercentage: 75, color: '#7c3aed' },
    ];

    const DEFAULT_TIMETABLE = [
      { id: 1, dayOfWeek: 'MONDAY', periodIndex: 1, slotTime: '09:00 - 10:00', subjectId: 1 },
      { id: 2, dayOfWeek: 'MONDAY', periodIndex: 2, slotTime: '10:15 - 11:15', subjectId: 2 },
      { id: 3, dayOfWeek: 'MONDAY', periodIndex: 3, slotTime: '11:30 - 12:30', subjectId: 3 },
      { id: 4, dayOfWeek: 'MONDAY', periodIndex: 4, slotTime: '02:00 - 03:00', subjectId: 4 },

      { id: 5, dayOfWeek: 'TUESDAY', periodIndex: 1, slotTime: '09:00 - 10:00', subjectId: 5 },
      { id: 6, dayOfWeek: 'TUESDAY', periodIndex: 2, slotTime: '10:15 - 11:15', subjectId: 1 },
      { id: 7, dayOfWeek: 'TUESDAY', periodIndex: 3, slotTime: '11:30 - 12:30', subjectId: 2 },
      { id: 8, dayOfWeek: 'TUESDAY', periodIndex: 4, slotTime: '02:00 - 03:00', subjectId: 3 },

      { id: 9, dayOfWeek: 'WEDNESDAY', periodIndex: 1, slotTime: '09:00 - 10:00', subjectId: 4 },
      { id: 10, dayOfWeek: 'WEDNESDAY', periodIndex: 2, slotTime: '10:15 - 11:15', subjectId: 5 },
      { id: 11, dayOfWeek: 'WEDNESDAY', periodIndex: 3, slotTime: '11:30 - 12:30', subjectId: 1 },
      { id: 12, dayOfWeek: 'WEDNESDAY', periodIndex: 4, slotTime: '02:00 - 03:00', subjectId: 2 },

      { id: 13, dayOfWeek: 'THURSDAY', periodIndex: 1, slotTime: '09:00 - 10:00', subjectId: 3 },
      { id: 14, dayOfWeek: 'THURSDAY', periodIndex: 2, slotTime: '10:15 - 11:15', subjectId: 4 },
      { id: 15, dayOfWeek: 'THURSDAY', periodIndex: 3, slotTime: '11:30 - 12:30', subjectId: 5 },
      { id: 16, dayOfWeek: 'THURSDAY', periodIndex: 4, slotTime: '02:00 - 03:00', subjectId: 1 },

      { id: 17, dayOfWeek: 'FRIDAY', periodIndex: 1, slotTime: '09:00 - 10:00', subjectId: 2 },
      { id: 18, dayOfWeek: 'FRIDAY', periodIndex: 2, slotTime: '10:15 - 11:15', subjectId: 3 },
      { id: 19, dayOfWeek: 'FRIDAY', periodIndex: 3, slotTime: '11:30 - 12:30', subjectId: 4 },
      { id: 20, dayOfWeek: 'FRIDAY', periodIndex: 4, slotTime: '02:00 - 03:00', subjectId: 5 },
    ];

    const DEFAULT_HOLIDAYS = [
      { id: 1, date: '2026-11-05', name: 'College Foundation Day', description: 'Annual cultural day - non-instructional' },
      { id: 2, date: '2026-11-14', name: 'Semester Break / Festival', description: 'Institutional declared holiday' },
    ];

    const DEFAULT_TRIPS = [
      {
        id: 1,
        tripName: 'Diwali Festive Trip Home',
        departureDate: '2026-10-14',
        returnDate: '2026-10-18',
        notes: 'Celebrated festival with family in hometown',
        overallStatus: 'SAFE',
        safeSubjectsCount: 5,
        atRiskSubjectsCount: 0,
        totalClassesMissed: 4,
        createdAt: '2026-10-19T10:30:00'
      }
    ];

    // --- CALCULATION HELPER FUNCTIONS (Strict Java Parity) ---
    function calculateCurrentAttendance(attended, conducted) {
      if (!conducted || conducted <= 0) return 100.0;
      return (attended / conducted) * 100.0;
    }

    function calculateProjectedAttendance(attended, conducted, missed) {
      const total = conducted + missed;
      if (total <= 0) return 100.0;
      return (attended / total) * 100.0;
    }

    const DAYS_ORDER = ['MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY', 'SUNDAY'];
    const PERIOD_SLOTS = [
      { index: 1, time: '09:00 - 10:00' },
      { index: 2, time: '10:15 - 11:15' },
      { index: 3, time: '11:30 - 12:30' },
      { index: 4, time: '02:00 - 03:00' },
    ];

    // --- MAIN REACT COMPONENT ---
    function App() {
      // Navigation with hash support (e.g. #settings, #admin, #subjects, #dashboard)
      const getInitialTab = () => {
        const hash = window.location.hash.replace('#', '').toLowerCase();
        if (hash === 'admin' || hash === 'settings') return 'settings';
        if (['dashboard', 'subjects', 'timetable', 'planner', 'max-safe', 'history'].includes(hash)) return hash;
        return 'landing';
      };

      const [currentTab, setCurrentTab] = useState(getInitialTab);

      useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash.replace('#', '').toLowerCase();
          if (hash === 'admin' || hash === 'settings') setCurrentTab('settings');
          else if (['dashboard', 'subjects', 'timetable', 'planner', 'max-safe', 'history', 'landing'].includes(hash)) {
            setCurrentTab(hash);
          }
        };
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      const navigateTo = (tab) => {
        window.location.hash = tab;
        setCurrentTab(tab);
      };
      
      // Data State (Stored in LocalStorage for offline persistence)
      const [subjects, setSubjects] = useState(() => {
        const saved = localStorage.getItem('tripsafe_subjects');
        return saved ? JSON.parse(saved) : DEFAULT_SUBJECTS;
      });

      const [timetable, setTimetable] = useState(() => {
        const saved = localStorage.getItem('tripsafe_timetable');
        return saved ? JSON.parse(saved) : DEFAULT_TIMETABLE;
      });

      const [holidays, setHolidays] = useState(() => {
        const saved = localStorage.getItem('tripsafe_holidays');
        return saved ? JSON.parse(saved) : DEFAULT_HOLIDAYS;
      });

      const [trips, setTrips] = useState(() => {
        const saved = localStorage.getItem('tripsafe_trips');
        return saved ? JSON.parse(saved) : DEFAULT_TRIPS;
      });

      const [studentProfile, setStudentProfile] = useState(() => {
        const saved = localStorage.getItem('tripsafe_profile');
        return saved ? JSON.parse(saved) : {
          name: 'Arjun Sharma',
          rollNumber: '21CS108',
          collegeName: 'Apex Institute of Technology',
          hostelBlock: 'Himalaya Hostel, Room 402',
          defaultMinAttendance: 75
        };
      });

      // Backend Connection State
      const [backendOnline, setBackendOnline] = useState(false);
      const [isCheckingBackend, setIsCheckingBackend] = useState(false);

      // Toast Notifications
      const [toast, setToast] = useState(null);
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3800);
      };

      // Sync data to localStorage
      useEffect(() => {
        localStorage.setItem('tripsafe_subjects', JSON.stringify(subjects));
      }, [subjects]);
      useEffect(() => {
        localStorage.setItem('tripsafe_timetable', JSON.stringify(timetable));
      }, [timetable]);
      useEffect(() => {
        localStorage.setItem('tripsafe_holidays', JSON.stringify(holidays));
      }, [holidays]);
      useEffect(() => {
        localStorage.setItem('tripsafe_trips', JSON.stringify(trips));
      }, [trips]);
      useEffect(() => {
        localStorage.setItem('tripsafe_profile', JSON.stringify(studentProfile));
      }, [studentProfile]);

      // Check Backend Health
      const checkBackend = async () => {
        setIsCheckingBackend(true);
        try {
          const res = await fetch('http://localhost:8080/api/dashboard', { signal: AbortSignal.timeout(1500) });
          if (res.ok) {
            setBackendOnline(true);
            showToast('Spring Boot REST API connected!', 'success');
          } else {
            setBackendOnline(false);
          }
        } catch (e) {
          setBackendOnline(false);
        } finally {
          setIsCheckingBackend(false);
        }
      };

      useEffect(() => {
        checkBackend();
      }, []);

      // Trigger lucide icon replacement after DOM updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // --- DERIVED METRICS ---
      const subjectStats = useMemo(() => {
        return subjects.map(s => {
          const currentPct = calculateCurrentAttendance(s.classesAttended, s.classesConducted);
          const isSafe = currentPct >= s.minAttendancePercentage;
          return {
            ...s,
            currentPct,
            isSafe
          };
        });
      }, [subjects]);

      const averageAttendance = useMemo(() => {
        if (subjectStats.length === 0) return 0;
        return subjectStats.reduce((acc, s) => acc + s.currentPct, 0) / subjectStats.length;
      }, [subjectStats]);

      const safeCount = subjectStats.filter(s => s.isSafe).length;
      const atRiskCount = subjectStats.length - safeCount;

      // Reset Demo Data
      const handleResetDemoData = () => {
        setSubjects(DEFAULT_SUBJECTS);
        setTimetable(DEFAULT_TIMETABLE);
        setHolidays(DEFAULT_HOLIDAYS);
        setTrips(DEFAULT_TRIPS);
        showToast('Demo data restored successfully!', 'info');
      };

      // Clear All Data
      const handleClearAllData = () => {
        if (confirm('Are you sure you want to clear all data? This will empty all subjects and schedules.')) {
          setSubjects([]);
          setTimetable([]);
          setHolidays([]);
          setTrips([]);
          showToast('All application data cleared.', 'warning');
        }
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Top Global Header */}
          <header className="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between items-center h-16">
                {/* Brand Logo */}
                <div 
                  onClick={() => setCurrentTab('landing')}
                  className="flex items-center gap-3 cursor-pointer group"
                >
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-700 via-indigo-600 to-blue-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20 group-hover:scale-105 transition-transform">
                    <i data-lucide="shield-check" className="w-6 h-6"></i>
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-extrabold text-xl tracking-tight bg-gradient-to-r from-slate-900 via-brand-900 to-indigo-900 bg-clip-text text-transparent">TripSafe</span>
                      <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-brand-50 text-brand-700 border border-brand-200">v1.0</span>
                    </div>
                    <p className="text-xs text-slate-500 hidden sm:block">Pre-Travel Attendance Risk Projector</p>
                  </div>
                </div>

                {/* Status and Action Header Bar */}
                <div className="flex items-center gap-3">
                  {/* Backend Status Pill */}
                  <div 
                    onClick={checkBackend}
                    title="Click to re-verify backend connectivity"
                    className={`flex items-center gap-2 text-xs font-medium px-3 py-1.5 rounded-full border cursor-pointer transition-all ${
                      backendOnline 
                        ? 'bg-emerald-50 text-emerald-800 border-emerald-200 hover:bg-emerald-100'
                        : 'bg-blue-50 text-blue-800 border-blue-200 hover:bg-blue-100'
                    }`}
                  >
                    <span className={`w-2 h-2 rounded-full animate-pulse ${backendOnline ? 'bg-emerald-500' : 'bg-blue-500'}`}></span>
                    <span className="hidden md:inline">
                      {backendOnline ? 'Spring Boot REST API: Connected' : 'Engine: Local Simulated Fallback'}
                    </span>
                    <span className="md:hidden">
                      {backendOnline ? 'API Online' : 'Local Engine'}
                    </span>
                    {isCheckingBackend && <i data-lucide="loader-2" className="w-3 h-3 animate-spin"></i>}
                  </div>

                  {/* Quick Plan Trip CTA */}
                  <button
                    onClick={() => setCurrentTab('planner')}
                    className="flex items-center gap-1.5 bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold px-3.5 py-2 rounded-lg shadow-sm shadow-brand-500/25 transition-all active:scale-95"
                  >
                    <i data-lucide="calendar" className="w-3.5 h-3.5"></i>
                    <span>Plan Trip</span>
                  </button>

                  {/* Profile Indicator */}
                  <div 
                    onClick={() => setCurrentTab('settings')}
                    className="flex items-center gap-2 pl-2 border-l border-slate-200 cursor-pointer hover:opacity-80"
                  >
                    <div className="w-8 h-8 rounded-full bg-slate-800 text-white flex items-center justify-center font-bold text-xs shadow-inner">
                      AS
                    </div>
                    <div className="text-left hidden lg:block">
                      <p className="text-xs font-semibold text-slate-800 leading-tight">{studentProfile.name}</p>
                      <p className="text-[10px] text-slate-500">{studentProfile.hostelBlock.split(',')[0]}</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            {/* Main Navigation Tabs */}
            <div className="bg-slate-50 border-t border-slate-200/80 px-4 sm:px-6 lg:px-8 overflow-x-auto">
              <div className="max-w-7xl mx-auto flex gap-1 sm:gap-2 py-1.5 min-w-max">
                {[
                  { id: 'landing', label: 'Overview & Guide', icon: 'sparkles' },
                  { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                  { id: 'subjects', label: `Subjects (${subjects.length})`, icon: 'book-open' },
                  { id: 'timetable', label: 'Weekly Timetable', icon: 'calendar-days' },
                  { id: 'planner', label: 'Trip Planner (Core)', icon: 'plane-takeoff', highlight: true },
                  { id: 'max-safe', label: 'Find Max Safe Trip', icon: 'compass' },
                  { id: 'history', label: `Trip History (${trips.length})`, icon: 'history' },
                  { id: 'settings', label: 'Administration & Settings', icon: 'settings-2' },
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => navigateTo(item.id)}
                    className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                      currentTab === item.id
                        ? 'bg-white text-brand-700 shadow-sm border border-slate-200/80'
                        : item.highlight
                          ? 'text-brand-600 hover:bg-brand-50/60 font-bold'
                          : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                    }`}
                  >
                    <i data-lucide={item.icon} className={`w-3.5 h-3.5 ${currentTab === item.id ? 'text-brand-600' : ''}`}></i>
                    <span>{item.label}</span>
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* Toast Notification Container */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 animate-bounce">
              <div className={`flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl text-white text-xs font-medium ${
                toast.type === 'warning' ? 'bg-amber-600' : toast.type === 'error' ? 'bg-rose-600' : 'bg-slate-900'
              }`}>
                <i data-lucide={toast.type === 'error' ? 'alert-octagon' : toast.type === 'warning' ? 'alert-triangle' : 'check-circle-2'} className="w-4 h-4"></i>
                <span>{toast.message}</span>
              </div>
            </div>
          )}

          {/* Main Workspace Body */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            {currentTab === 'landing' && (
              <LandingPage 
                onOpenDashboard={() => setCurrentTab('dashboard')}
                onPlanTrip={() => setCurrentTab('planner')}
                onManageSubjects={() => setCurrentTab('subjects')}
              />
            )}

            {currentTab === 'dashboard' && (
              <DashboardView
                subjects={subjectStats}
                averageAttendance={averageAttendance}
                safeCount={safeCount}
                atRiskCount={atRiskCount}
                trips={trips}
                onPlanTrip={() => setCurrentTab('planner')}
                onGoToSubjects={() => setCurrentTab('subjects')}
                onGoToTimetable={() => setCurrentTab('timetable')}
                onLoadDemo={handleResetDemoData}
              />
            )}

            {currentTab === 'subjects' && (
              <SubjectManagementView
                subjects={subjects}
                setSubjects={setSubjects}
                showToast={showToast}
              />
            )}

            {currentTab === 'timetable' && (
              <TimetableView
                subjects={subjects}
                timetable={timetable}
                setTimetable={setTimetable}
                holidays={holidays}
                setHolidays={setHolidays}
                showToast={showToast}
              />
            )}

            {currentTab === 'planner' && (
              <TripPlannerView
                subjects={subjects}
                timetable={timetable}
                holidays={holidays}
                trips={trips}
                setTrips={setTrips}
                showToast={showToast}
                onViewHistory={() => setCurrentTab('history')}
              />
            )}

            {currentTab === 'max-safe' && (
              <MaxSafeTripView
                subjects={subjects}
                timetable={timetable}
                holidays={holidays}
                showToast={showToast}
                onOpenPlanner={() => setCurrentTab('planner')}
              />
            )}

            {currentTab === 'history' && (
              <TripHistoryView
                trips={trips}
                setTrips={setTrips}
                showToast={showToast}
                onPlanTrip={() => setCurrentTab('planner')}
              />
            )}

            {currentTab === 'settings' && (
              <SettingsView
                profile={studentProfile}
                setProfile={setStudentProfile}
                backendOnline={backendOnline}
                onCheckBackend={checkBackend}
                onResetDemo={handleResetDemoData}
                onClearAll={handleClearAllData}
                showToast={showToast}
              />
            )}
          </main>

          {/* Clean Academic Footer */}
          <footer className="mt-auto bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-3">
              <div className="flex items-center gap-2">
                <i data-lucide="shield" className="w-4 h-4 text-brand-600"></i>
                <span className="font-semibold text-slate-800">TripSafe</span>
                <span>— Pre-Travel Attendance Risk Projector for Hostel Students</span>
              </div>
              <p>College Java Full-Stack Project • Spring Boot REST & React TypeScript</p>
            </div>
          </footer>
        </div>
      );
    }

    // =========================================================================
    // 1. LANDING PAGE COMPONENT
    // =========================================================================
    function LandingPage({ onOpenDashboard, onPlanTrip, onManageSubjects }) {
      return (
        <div className="space-y-12 py-4">
          {/* Hero Section */}
          <div className="relative rounded-3xl bg-gradient-to-br from-slate-900 via-brand-950 to-indigo-950 text-white p-8 sm:p-14 overflow-hidden shadow-2xl border border-indigo-900/50">
            {/* Background Glow Orbs */}
            <div className="absolute -top-24 -right-24 w-96 h-96 bg-brand-500/20 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute -bottom-24 -left-24 w-96 h-96 bg-blue-500/15 rounded-full blur-3xl pointer-events-none"></div>

            <div className="relative z-10 max-w-3xl space-y-6">
              <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-brand-500/10 border border-brand-400/30 text-brand-300 text-xs font-semibold uppercase tracking-wider">
                <i data-lucide="check-circle" className="w-3.5 h-3.5 text-brand-400"></i>
                <span>College Attendance Risk Projector</span>
              </div>

              <h1 className="text-3xl sm:text-5xl font-extrabold tracking-tight leading-tight sm:leading-none">
                Travel Home Without Losing Track of Attendance.
              </h1>

              <p className="text-slate-300 text-base sm:text-lg leading-relaxed">
                Hostel students shouldn't have to guess or manually calculate class cuts before booking travel.
                <strong className="text-white font-semibold"> TripSafe</strong> models your weekly timetable, excludes institutional holidays, and calculates accurate subject-wise attendance projections down to the single class.
              </p>

              <div className="flex flex-wrap items-center gap-4 pt-2">
                <button
                  onClick={onOpenDashboard}
                  className="flex items-center gap-2 bg-brand-600 hover:bg-brand-500 text-white font-bold px-6 py-3.5 rounded-xl shadow-lg shadow-brand-600/30 transition-all hover:-translate-y-0.5 active:translate-y-0"
                >
                  <i data-lucide="layout-dashboard" className="w-5 h-5"></i>
                  <span>Open Dashboard</span>
                </button>

                <button
                  onClick={onPlanTrip}
                  className="flex items-center gap-2 bg-white/10 hover:bg-white/15 text-white font-semibold px-6 py-3.5 rounded-xl border border-white/20 transition-all"
                >
                  <i data-lucide="plane-takeoff" className="w-5 h-5 text-brand-300"></i>
                  <span>Simulate a Trip</span>
                </button>
              </div>
            </div>

    // =========================================================================
    // 3. SUBJECT MANAGEMENT VIEW
    // =========================================================================
    function SubjectManagementView({ subjects, setSubjects, showToast }) {
      const [search, setSearch] = useState('');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingSubject, setEditingSubject] = useState(null);

      // Form state
      const [name, setName] = useState('');
      const [code, setCode] = useState('');
      const [conducted, setConducted] = useState(60);
      const [attended, setAttended] = useState(48);
      const [minReq, setMinReq] = useState(75);
      const [color, setColor] = useState('#4f46e5');
      const [formError, setFormError] = useState('');

      const filtered = useMemo(() => {
        return subjects.filter(s => 
          s.name.toLowerCase().includes(search.toLowerCase()) || 
          (s.code && s.code.toLowerCase().includes(search.toLowerCase()))
        );
      }, [subjects, search]);

      const openAddModal = () => {
        setEditingSubject(null);
        setName('');
        setCode('');
        setConducted(50);
        setAttended(40);
        setMinReq(75);
        setColor('#4f46e5');
        setFormError('');
        setIsModalOpen(true);
      };

      const openEditModal = (sub) => {
        setEditingSubject(sub);
        setName(sub.name);
        setCode(sub.code || '');
        setConducted(sub.classesConducted);
        setAttended(sub.classesAttended);
        setMinReq(sub.minAttendancePercentage);
        setColor(sub.color || '#4f46e5');
        setFormError('');
        setIsModalOpen(true);
      };

      const handleSave = (e) => {
        e.preventDefault();
        setFormError('');

        if (!name.trim()) {
          setFormError('Subject name cannot be empty.');
          return;
        }

        const condNum = parseInt(conducted, 10);
        const attNum = parseInt(attended, 10);
        const reqNum = parseFloat(minReq);

        if (isNaN(condNum) || condNum < 0) {
          setFormError('Conducted classes must be a non-negative integer.');
          return;
        }

        if (isNaN(attNum) || attNum < 0) {
          setFormError('Attended classes must be a non-negative integer.');
          return;
        }

        if (attNum > condNum) {
          setFormError(`Classes attended (${attNum}) cannot exceed classes conducted (${condNum}).`);
          return;
        }

        if (isNaN(reqNum) || reqNum < 0 || reqNum > 100) {
          setFormError('Minimum requirement must be between 0% and 100%.');
          return;
        }

        if (editingSubject) {
          setSubjects(prev => prev.map(s => s.id === editingSubject.id ? {
            ...s,
            name: name.trim(),
            code: code.trim().toUpperCase(),
            classesConducted: condNum,
            classesAttended: attNum,
            minAttendancePercentage: reqNum,
            color
          } : s));
          showToast(`Subject "${name}" updated successfully!`, 'success');
        } else {
          const newId = subjects.length > 0 ? Math.max(...subjects.map(s => s.id)) + 1 : 1;
          const newSub = {
            id: newId,
            name: name.trim(),
            code: code.trim().toUpperCase(),
            classesConducted: condNum,
            classesAttended: attNum,
            minAttendancePercentage: reqNum,
            color
          };
          setSubjects(prev => [...prev, newSub]);
          showToast(`Subject "${name}" added!`, 'success');
        }

        setIsModalOpen(false);
      };

      const handleDelete = (id, subName) => {
        if (confirm(`Are you sure you want to delete "${subName}"? This will also remove any weekly timetable slots assigned to this subject.`)) {
          setSubjects(prev => prev.filter(s => s.id !== id));
          showToast(`Subject "${subName}" removed.`, 'warning');
        }
      };

      const previewPct = calculateCurrentAttendance(attended, conducted);

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div>
              <h1 className="text-xl sm:text-2xl font-bold text-slate-900">Subject Management</h1>
              <p className="text-xs sm:text-sm text-slate-500">Configure academic subjects, class tallies, and target percentages.</p>
            </div>
            <div className="flex items-center gap-3 w-full sm:w-auto">
              <input
                type="text"
                placeholder="Search subject or code..."
                value={search}
                onChange={e => setSearch(e.target.value)}
                className="w-full sm:w-56 text-xs px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600"
              />
              <button
                onClick={openAddModal}
                className="flex items-center gap-1.5 bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-sm whitespace-nowrap"
              >
                <i data-lucide="plus" className="w-4 h-4"></i>
                <span>Add Subject</span>
              </button>
            </div>
          </div>

          {/* Subjects Table / Cards */}
          <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-50 text-slate-600 font-semibold border-b border-slate-200">
                  <tr>
                    <th className="py-3 px-4">Subject</th>
                    <th className="py-3 px-4">Code</th>

                {formError && (

      // Slot Assignment Modal State

      const [selectedPeriod, setSelectedPeriod] = useState(1);

      // Holiday Modal State
      const [holidayModalOpen, setHolidayModalOpen] = useState(false);
      const [holidayDate, setHolidayDate] = useState('');
      const [holidayName, setHolidayName] = useState('');
      const [holidayDesc, setHolidayDesc] = useState('');

      const openSlotModal = (day, periodIndex, time) => {
        setSelectedDay(day);
        setSelectedPeriod(periodIndex);
        setSelectedTime(time);
        const existing = timetable.find(t => t.dayOfWeek === day && t.periodIndex === periodIndex);
        setSelectedSubjectId(existing ? existing.subjectId : (subjects[0]?.id || 1));
        setSlotModalOpen(true);
      };

      const handleSaveSlot = (e) => {
        e.preventDefault();
        const subIdNum = parseInt(selectedSubjectId, 10);
        const sub = subjects.find(s => s.id === subIdNum);
        if (!sub) return;

        setTimetable(prev => {
          const filtered = prev.filter(t => !(t.dayOfWeek === selectedDay && t.periodIndex === selectedPeriod));
          const newEntry = {
            id: Date.now(),
            dayOfWeek: selectedDay,
            periodIndex: selectedPeriod,
            slotTime: selectedTime,
            subjectId: subIdNum
          };
          return [...filtered, newEntry];
        });

        showToast(`Slot assigned: ${selectedDay} Period ${selectedPeriod} → ${sub.name}`);
        setSlotModalOpen(false);
      };

      const handleClearSlot = (day, periodIndex) => {
        setTimetable(prev => prev.filter(t => !(t.dayOfWeek === day && t.periodIndex === periodIndex)));
        showToast(`Cleared slot on ${day} Period ${periodIndex}.`, 'info');
      };

      const handleAddHoliday = (e) => {
        e.preventDefault();
        if (!holidayDate || !holidayName.trim()) {
          alert('Please enter a valid date and holiday title.');
          return;
        }

        const newHol = {
          id: Date.now(),
          date: holidayDate,
          name: holidayName.trim(),
          description: holidayDesc.trim()
        };
        setHolidays(prev => [...prev, newHol]);
        showToast(`Holiday "${holidayName}" added for ${holidayDate}.`);
        setHolidayDate('');
        setHolidayName('');
        setHolidayDesc('');
        setHolidayModalOpen(false);
      };

      const handleDeleteHoliday = (id, name) => {
        setHolidays(prev => prev.filter(h => h.id !== id));
        showToast(`Holiday "${name}" deleted.`);

            <div>

              <p className="text-xs sm:text-sm text-slate-500">
                Maps each class to specific days of the week so trip cuts are calculated precisely.
              </p>
            </div>
            <div className="flex items-center gap-2">
              <div className="bg-slate-100 p-1 rounded-xl flex gap-1 border border-slate-200">
                <button
                  onClick={() => setActiveSubTab('grid')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                    activeSubTab === 'grid' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'

                  Timetable Grid

                <button

          {activeSubTab === 'grid' && (
            <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
              <div className="flex justify-between items-center text-xs text-slate-500">

              </div>

              {/* Timetable Grid Table */}
              <div className="overflow-x-auto">
                <table className="w-full border-collapse text-xs">
                  <thead>
                    <tr className="border-b border-slate-200">
                      <th className="py-3 px-3 text-left font-bold text-slate-700 w-32 bg-slate-50/80">Day / Period</th>

                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {['MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY'].map(day => (
                      <tr key={day} className="hover:bg-slate-50/40">
                        <td className="py-3 px-3 font-bold text-slate-800 bg-slate-50/40">{day}</td>
                        {PERIOD_SLOTS.map(slot => {

                                    <span>{sub.code || 'CS'}</span>
                                    <span className="text-[9px] px-1.5 rounded-full" style={{ backgroundColor: sub.color, color: '#fff' }}>

                                <button

                                  className="w-full py-3 px-2 rounded-xl border border-dashed border-slate-200 hover:border-brand-400 hover:bg-brand-50/30 text-slate-400 hover:text-brand-600 text-xs transition-colors"
                                >
                                  + Assign
                                </button>
                              )}
                            </td>
                          );
                        })}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {activeSubTab === 'holidays' && (
            <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
              <div className="flex justify-between items-center">
                <div>

                >
                  <i data-lucide="plus" className="w-3.5 h-3.5"></i>
                  <span>Add Holiday</span>
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 pt-2">
                {holidays.map(h => (
                  <div key={h.id} className="p-4 rounded-xl border border-slate-200 bg-slate-50/60 flex justify-between items-start">
                    <div className="space-y-1">
                      <div className="inline-flex items-center gap-1 text-[11px] font-mono font-bold text-brand-700 bg-brand-50 px-2 py-0.5 rounded border border-brand-200">
                        <i data-lucide="calendar" className="w-3 h-3"></i>
                        <span>{h.date}</span>
                      </div>
                      <h4 className="font-bold text-sm text-slate-900">{h.name}</h4>
                      {h.description && <p className="text-xs text-slate-500">{h.description}</p>}
                    </div>
                    <button
                      onClick={() => handleDeleteHoliday(h.id, h.name)}
                      className="text-slate-400 hover:text-rose-600 p-1"
                      title="Delete Holiday"
                    >
                      <i data-lucide="trash-2" className="w-4 h-4"></i>
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Slot Assignment Modal */}
          {slotModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-sm text-slate-900">
                    Assign Slot: {selectedDay} (Period {selectedPeriod})

                  <button onClick={() => setSlotModalOpen(false)} className="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>

                <form onSubmit={handleSaveSlot} className="space-y-4 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Select Subject</label>

                      value={selectedSubjectId}
                      onChange={e => setSelectedSubjectId(e.target.value)}
                      className="w-full px-3 py-2 border rounded-xl border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500"
                    >
                      {subjects.map(s => (

                      type="button"
                      onClick={() => setSlotModalOpen(false)}

          {holidayModalOpen && (

              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 space-y-4">
