    // =========================================================================
    // 5. TRIP PLANNER VIEW (CORE ENGINE)
    // =========================================================================
    function TripPlannerView({ subjects, timetable, holidays, trips, setTrips, showToast, onViewHistory }) {
      // Default to next Monday - Friday
      const getNextMonday = () => {
        const d = new Date();
        d.setDate(d.getDate() + ((1 + 7 - d.getDay()) % 7 || 7));
        return d.toISOString().split('T')[0];
      };

      const getNextFriday = () => {
        const d = new Date();
        d.setDate(d.getDate() + ((5 + 7 - d.getDay()) % 7 || 7));
        return d.toISOString().split('T')[0];
      };

      const [tripName, setTripName] = useState('Home Weekend Visit');
      const [departureDate, setDepartureDate] = useState(getNextMonday());
      const [returnDate, setReturnDate] = useState(getNextFriday());
      const [notes, setNotes] = useState('Visiting family in hometown');
      const [projectionResult, setProjectionResult] = useState(null);
      const [isCalculating, setIsCalculating] = useState(false);

      // Core Risk Calculation
      const handleCalculateRisk = (e) => {
        e.preventDefault();
        if (!departureDate || !returnDate) {
          alert('Please choose departure and return dates.');
          return;
        }

        const start = new Date(departureDate + 'T00:00:00');
        const end = new Date(returnDate + 'T00:00:00');

        if (end < start) {
          alert('Return date cannot be earlier than departure date.');
          return;
        }

        setIsCalculating(true);

        setTimeout(() => {
          // Count missed classes per subject (inclusive range, skip holidays)
          const holidaySet = new Set(holidays.map(h => h.date));
          const missedCounts = {};
          subjects.forEach(s => { missedCounts[s.id] = 0; });

          const dayNames = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
          let cur = new Date(start);
          let durationDays = 0;

          while (cur <= end) {
            durationDays++;
            const dateStr = cur.toISOString().split('T')[0];
            if (!holidaySet.has(dateStr)) {
              const dayOfWeek = dayNames[cur.getDay()];
              const daySlots = timetable.filter(t => t.dayOfWeek === dayOfWeek);
              daySlots.forEach(slot => {
                if (missedCounts[slot.subjectId] !== undefined) {
                  missedCounts[slot.subjectId]++;
                }
              });
            }
            cur.setDate(cur.getDate() + 1);
          }

          let safeCount = 0;
          let atRiskCount = 0;
          let totalMissed = 0;
          let bottleneck = null;

          const subjectProjections = subjects.map(sub => {
            const missed = missedCounts[sub.id] || 0;
            totalMissed += missed;

            const currentPct = calculateCurrentAttendance(sub.classesAttended, sub.classesConducted);
            const projectedPct = calculateProjectedAttendance(sub.classesAttended, sub.classesConducted, missed);
            const isSafe = (projectedPct + 1e-9) >= sub.minAttendancePercentage;
            const margin = projectedPct - sub.minAttendancePercentage;

            if (isSafe) safeCount++;
            else atRiskCount++;

            let explanation = '';
            if (missed === 0) {
              explanation = `No scheduled classes in this trip window. Attendance holds steady at ${currentPct.toFixed(1)}%.`;
            } else if (isSafe) {
              explanation = `Missing ${missed} class(es) reduces attendance from ${currentPct.toFixed(1)}% to ${projectedPct.toFixed(1)}% (remains ${margin.toFixed(1)}% above the required ${sub.minAttendancePercentage}%).`;
            } else {
              explanation = `CRITICAL DEBARMENT RISK: Missing ${missed} class(es) plunges attendance to ${projectedPct.toFixed(1)}%, falling ${Math.abs(margin).toFixed(1)}% below the ${sub.minAttendancePercentage}% cutoff!`;
            }

            const item = {
              subjectId: sub.id,
              subjectName: sub.name,
              subjectCode: sub.code,
              color: sub.color,
              classesConductedBefore: sub.classesConducted,
              classesAttended: sub.classesAttended,
              currentAttendancePercentage: currentPct,
              expectedMissedClasses: missed,
              classesConductedAfter: sub.classesConducted + missed,
              projectedAttendancePercentage: projectedPct,
              requiredAttendancePercentage: sub.minAttendancePercentage,
              isSafe,
              riskMargin: margin,
              explanation
            };

            if (!bottleneck || margin < bottleneck.riskMargin) {
              bottleneck = item;
            }

            return item;
          });

          // STRICT RULE: Safe ONLY if ALL subjects are safe!
          const overallStatus = atRiskCount > 0 ? 'AT_RISK' : 'SAFE';

          const result = {
            tripName: tripName || 'Planned Travel',
            departureDate,
            returnDate,
            durationDays,
            overallStatus,
            safeCount,
            atRiskCount,
            totalMissedClasses: totalMissed,
            subjectProjections,
            bottleneck,
            calculatedAt: new Date().toISOString()
          };

          setProjectionResult(result);
          setIsCalculating(false);
          showToast(`Projection calculated: Overall Trip is ${overallStatus === 'SAFE' ? 'SAFE' : 'AT RISK'}!`, overallStatus === 'SAFE' ? 'success' : 'warning');
        }, 200);
      };

      // Save Trip to History
      const handleSaveTrip = () => {
        if (!projectionResult) return;
        const newTrip = {
          id: Date.now(),
          tripName: projectionResult.tripName,
          departureDate: projectionResult.departureDate,
          returnDate: projectionResult.returnDate,
          notes,
          overallStatus: projectionResult.overallStatus,
          safeSubjectsCount: projectionResult.safeCount,
          atRiskSubjectsCount: projectionResult.atRiskCount,
          totalClassesMissed: projectionResult.totalMissedClasses,
          projectionDetailsJson: JSON.stringify(projectionResult.subjectProjections),
          createdAt: new Date().toISOString()
        };

        setTrips(prev => [newTrip, ...prev]);
        showToast(`Trip "${projectionResult.tripName}" saved to history!`, 'success');
      };

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-brand-50 text-brand-700 text-[11px] font-bold uppercase tracking-wider mb-1 border border-brand-200">
                <i data-lucide="shield" className="w-3 h-3"></i>
                <span>Core Attendance Projector</span>
              </div>
              <h1 className="text-xl sm:text-2xl font-bold text-slate-900">Pre-Travel Attendance Risk Calculator</h1>
              <p className="text-xs sm:text-sm text-slate-500">
                Simulate your journey and get an instant subject-wise risk assessment.
              </p>
            </div>
            <button
              onClick={onViewHistory}
              className="text-xs font-semibold text-brand-600 hover:text-brand-800 flex items-center gap-1"
            >
              <i data-lucide="history" className="w-4 h-4"></i>
              <span>View Past Saved Trips ({trips.length})</span>
            </button>
          </div>

          {/* Form Card */}
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <form onSubmit={handleCalculateRisk} className="space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Trip Name / Purpose</label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. Festival Homecoming"
                    value={tripName}
                    onChange={e => setTripName(e.target.value)}
                    className="w-full px-3.5 py-2.5 border rounded-xl border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500"
                  />
                </div>

                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Departure Date (Inclusive)</label>
                  <input
                    type="date"
                    required
                    value={departureDate}
                    onChange={e => setDepartureDate(e.target.value)}
                    className="w-full px-3.5 py-2.5 border rounded-xl border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500"
                  />
                </div>

                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Return Date (Inclusive)</label>
                  <input
                    type="date"
                    required
                    value={returnDate}
                    onChange={e => setReturnDate(e.target.value)}
                    className="w-full px-3.5 py-2.5 border rounded-xl border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500"
                  />
                </div>
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1 text-xs">Trip Notes (Optional)</label>
                <input
                  type="text"
                  placeholder="e.g. Train leaves at 6 AM, returning Sunday night"
                  value={notes}
                  onChange={e => setNotes(e.target.value)}
                  className="w-full text-xs px-3.5 py-2 border rounded-xl border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
              </div>

              <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                <span className="text-xs text-slate-500">
                  Counting classes across all schedule days, excluding {holidays.length} recorded holidays.
                </span>
                <button
                  type="submit"
                  disabled={isCalculating}
                  className="flex items-center gap-2 bg-brand-600 hover:bg-brand-700 disabled:opacity-50 text-white font-bold text-xs px-6 py-3 rounded-xl shadow-md transition-all active:scale-95"
                >
                  <i data-lucide="calculator" className="w-4 h-4"></i>
                  <span>{isCalculating ? 'Calculating...' : 'Calculate Travel Risk'}</span>
                </button>
              </div>
            </form>
          </div>

          {/* Results Display */}
          {projectionResult && (
            <div className="space-y-6 animate-in fade-in duration-200">
              {/* Overall Trip Risk Banner */}
              <div className={`p-6 rounded-2xl border shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4 ${
                projectionResult.overallStatus === 'SAFE'
                  ? 'bg-emerald-50 border-emerald-200 text-emerald-950'
                  : 'bg-rose-50 border-rose-200 text-rose-950'
              }`}>
                <div className="flex items-start gap-3">
                  <div className={`w-12 h-12 rounded-2xl flex items-center justify-center flex-shrink-0 text-white ${
                    projectionResult.overallStatus === 'SAFE' ? 'bg-emerald-600' : 'bg-rose-600'
                  }`}>
                    <i data-lucide={projectionResult.overallStatus === 'SAFE' ? 'shield-check' : 'alert-octagon'} className="w-6 h-6"></i>
                  </div>
                  <div className="space-y-1">
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-white/70">
                        Trip Duration: {projectionResult.durationDays} Days
                      </span>
                      <span className="text-xs text-slate-500">
                        ({projectionResult.departureDate} → {projectionResult.returnDate})
                      </span>
                    </div>
                    <h3 className="text-xl font-extrabold">
                      {projectionResult.overallStatus === 'SAFE'
                        ? 'Trip Approved — Attendance Remains Safe!'
                        : 'HIGH RISK WARNING — At Least One Subject Will Breach Attendance!'}
                    </h3>
                    <p className="text-xs leading-relaxed max-w-2xl opacity-90">
                      {projectionResult.overallStatus === 'SAFE'
                        ? `All ${projectionResult.safeCount} subjects remain at or above their minimum required attendance percentages after missing a total of ${projectionResult.totalMissedClasses} scheduled classes.`
                        : `CRITICAL: You will miss ${projectionResult.totalMissedClasses} classes. While ${projectionResult.safeCount} subjects stay above water, ${projectionResult.atRiskCount} subject(s) breach the 75% limit. Bottleneck: '${projectionResult.bottleneck?.subjectName}' will drop to ${projectionResult.bottleneck?.projectedAttendancePercentage.toFixed(1)}%.`}
                    </p>
                  </div>
                </div>

                <div className="flex items-center gap-2 flex-shrink-0">
                  <button
                    onClick={handleSaveTrip}
                    className="flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-sm"
                  >
                    <i data-lucide="bookmark" className="w-3.5 h-3.5"></i>
                    <span>Save Trip</span>
                  </button>
                </div>
              </div>

              {/* Subject-Wise Projection Breakdown Table */}
              <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                <div className="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                  <h3 className="font-bold text-sm text-slate-900">Subject-by-Subject Projection Results</h3>
                  <span className="text-xs text-slate-500 font-mono">
                    Formula: Projected = Attended / (Conducted + Missed) × 100
                  </span>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-50/80 text-slate-600 font-semibold border-b border-slate-200">
                      <tr>
                        <th className="py-3 px-4">Subject</th>
                        <th className="py-3 px-4">Current Attendance</th>
                        <th className="py-3 px-4">Classes Missed</th>
                        <th className="py-3 px-4">Projected Attendance</th>
                        <th className="py-3 px-4">Required %</th>
                        <th className="py-3 px-4">Status</th>
                        <th className="py-3 px-4">Analysis & Explanation</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-medium">
                      {projectionResult.subjectProjections.map(p => (
                        <tr key={p.subjectId} className={`hover:bg-slate-50/60 ${!p.isSafe ? 'bg-rose-50/30' : ''}`}>
                          <td className="py-3 px-4">
                            <div className="flex items-center gap-2">
                              <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ backgroundColor: p.color }}></span>
                              <div>
                                <div className="font-bold text-slate-900">{p.subjectName}</div>
                                <div className="text-[10px] font-mono text-slate-400">{p.subjectCode}</div>
                              </div>
                            </div>
                          </td>
                          <td className="py-3 px-4 font-mono">
                            {p.classesAttended}/{p.classesConductedBefore} ({p.currentAttendancePercentage.toFixed(1)}%)
                          </td>
                          <td className="py-3 px-4">
                            <span className={`px-2 py-0.5 rounded font-bold font-mono ${
                              p.expectedMissedClasses > 0 ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-600'
                            }`}>
                              +{p.expectedMissedClasses} class{p.expectedMissedClasses === 1 ? '' : 'es'}
                            </span>
                          </td>
                          <td className="py-3 px-4 font-mono font-extrabold">
                            <span className={p.isSafe ? 'text-slate-900' : 'text-rose-600'}>
                              {p.projectedAttendancePercentage.toFixed(1)}%
                            </span>
                            <span className="text-[10px] text-slate-400 block font-normal">
                              ({p.classesAttended}/{p.classesConductedAfter})
                            </span>
                          </td>
                          <td className="py-3 px-4 text-slate-500">{p.requiredAttendancePercentage}%</td>
                          <td className="py-3 px-4">
                            <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                              p.isSafe ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-100 text-rose-800 border border-rose-300'
                            }`}>
                              {p.isSafe ? 'SAFE' : 'AT RISK'}
                            </span>
                          </td>
                          <td className="py-3 px-4 text-[11px] text-slate-600 max-w-xs leading-relaxed">
                            {p.explanation}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 6. FIND MAXIMUM SAFE TRIP VIEW
    // =========================================================================
    function MaxSafeTripView({ subjects, timetable, holidays, showToast, onOpenPlanner }) {
      const today = new Date().toISOString().split('T')[0];
      const [depDate, setDepDate] = useState(today);
      const [horizonDays, setHorizonDays] = useState(30);
      const [maxSafeResult, setMaxSafeResult] = useState(null);
      const [isSearching, setIsSearching] = useState(false);

      const handleSearch = (e) => {
        e.preventDefault();
        setIsSearching(true);

        setTimeout(() => {
          const holidaySet = new Set(holidays.map(h => h.date));
          const dayNames = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];

          let lastSafeDate = null;
          let lastSafeProjections = null;
          let limiter = null;
          let safeDaysCount = 0;

          // Day-by-day forward search
          for (let offset = 0; offset < horizonDays; offset++) {
            const cur = new Date(depDate + 'T00:00:00');
            cur.setDate(cur.getDate() + offset);
            const candDate = cur.toISOString().split('T')[0];

            // Calculate missed classes from depDate through candDate
            const missedCounts = {};
            subjects.forEach(s => { missedCounts[s.id] = 0; });

            let iter = new Date(depDate + 'T00:00:00');
            const targetEnd = new Date(candDate + 'T00:00:00');
            while (iter <= targetEnd) {
              const dStr = iter.toISOString().split('T')[0];
              if (!holidaySet.has(dStr)) {
                const dayOfWeek = dayNames[iter.getDay()];
                const slots = timetable.filter(t => t.dayOfWeek === dayOfWeek);
                slots.forEach(sl => {
                  if (missedCounts[sl.subjectId] !== undefined) missedCounts[sl.subjectId]++;
                });
              }
              iter.setDate(iter.getDate() + 1);
            }

            // Check if all subjects are safe
            let anySubjectAtRisk = false;
            let currentBottleneck = null;

            const projections = subjects.map(s => {
              const missed = missedCounts[s.id] || 0;
              const currentPct = calculateCurrentAttendance(s.classesAttended, s.classesConducted);
              const projectedPct = calculateProjectedAttendance(s.classesAttended, s.classesConducted, missed);
              const isSafe = (projectedPct + 1e-9) >= s.minAttendancePercentage;
              const margin = projectedPct - s.minAttendancePercentage;

              if (!isSafe) anySubjectAtRisk = true;

              const res = {
                subjectId: s.id,
                subjectName: s.name,
                subjectCode: s.code,
                color: s.color,
                classesAttended: s.classesAttended,
                classesConducted: s.classesConducted,
                expectedMissedClasses: missed,
                projectedAttendancePercentage: projectedPct,
                requiredAttendancePercentage: s.minAttendancePercentage,
                isSafe,
                riskMargin: margin
              };

              if (!currentBottleneck || margin < currentBottleneck.riskMargin) {
                currentBottleneck = res;
              }

              return res;
            });

            if (!anySubjectAtRisk) {
              lastSafeDate = candDate;
              lastSafeProjections = projections;
              safeDaysCount = offset + 1;
            } else {
              if (offset === 0) {
                // Departure date itself fails!
                setMaxSafeResult({
                  departureDate: depDate,
                  recommendedReturnDate: depDate,
                  safeDays: 0,
                  departureDateSafe: false,
                  limitingSubject: currentBottleneck,
                  explanation: `CRITICAL: Missing classes on the departure date (${depDate}) alone causes '${currentBottleneck?.subjectName}' to drop to ${currentBottleneck?.projectedAttendancePercentage.toFixed(1)}%. You cannot travel safely on this date without attendance failure.`,
                  projections
                });
                setIsSearching(false);
                return;
              }
              limiter = currentBottleneck;
              break;
            }
          }

          setMaxSafeResult({
            departureDate: depDate,
            recommendedReturnDate: lastSafeDate,
            safeDays: safeDaysCount,
            departureDateSafe: true,
            limitingSubject: limiter,
            reachedHorizon: safeDaysCount === horizonDays,
            explanation: safeDaysCount === horizonDays
              ? `You can safely travel for the full ${horizonDays} days up to ${lastSafeDate} without violating attendance in any subject.`
              : `Your maximum safe travel window is ${safeDaysCount} day(s) until ${lastSafeDate}. Extending your journey further breaches attendance in '${limiter?.subjectName}'.`,
            projections: lastSafeProjections
          });

          setIsSearching(false);
          showToast(`Maximum safe travel duration calculated: ${safeDaysCount} days!`);
        }, 250);
      };

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 text-[11px] font-bold uppercase tracking-wider mb-1 border border-blue-200">
              <i data-lucide="compass" className="w-3 h-3"></i>
              <span>Automated Duration Optimization</span>
            </div>
            <h1 className="text-xl sm:text-2xl font-bold text-slate-900">Find My Maximum Safe Trip</h1>
            <p className="text-xs sm:text-sm text-slate-500">
              Pick your intended departure date. TripSafe searches day-by-day along your schedule to determine the exact return date before any subject falls below 75%.
            </p>
          </div>

          {/* Configuration Form */}
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <form onSubmit={handleSearch} className="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end text-xs">
              <div>
                <label className="block font-semibold text-slate-700 mb-1">Departure Date</label>
                <input
                  type="date"
                  required
                  value={depDate}
                  onChange={e => setDepDate(e.target.value)}
                  className="w-full px-3.5 py-2.5 border rounded-xl border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Search Horizon (Days)</label>
                <select
                  value={horizonDays}
                  onChange={e => setHorizonDays(parseInt(e.target.value, 10))}
                  className="w-full px-3.5 py-2.5 border rounded-xl border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500"
                >
                  <option value={7}>7 Days (1 Week Horizon)</option>
                  <option value={14}>14 Days (2 Weeks Horizon)</option>
                  <option value={21}>21 Days (3 Weeks Horizon)</option>
                  <option value={30}>30 Days (1 Month Horizon)</option>
                  <option value={60}>60 Days (Extended Horizon)</option>
                </select>
              </div>

              <div>
                <button
                  type="submit"
                  disabled={isSearching}
                  className="w-full flex items-center justify-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-bold py-2.5 px-4 rounded-xl shadow-md transition-all active:scale-95"
                >
                  <i data-lucide="search" className="w-4 h-4"></i>
                  <span>{isSearching ? 'Analyzing...' : 'Find Maximum Safe Window'}</span>
                </button>
              </div>
            </form>
          </div>

          {/* Results Display */}
          {maxSafeResult && (
            <div className="space-y-6 animate-in fade-in duration-200">
              <div className={`p-6 rounded-2xl border shadow-sm ${
                maxSafeResult.safeDays > 0 ? 'bg-indigo-50/70 border-indigo-200 text-slate-900' : 'bg-rose-50 border-rose-200 text-rose-950'
              }`}>
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                  <div className="space-y-2">
                    <span className="text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full bg-white text-brand-700 border border-brand-200">
                      Recommended Safe Duration
                    </span>
                    <h2 className="text-3xl font-extrabold text-slate-900">
                      {maxSafeResult.safeDays} Safe Day{maxSafeResult.safeDays === 1 ? '' : 's'}
                    </h2>
                    <p className="text-xs text-slate-600 max-w-2xl leading-relaxed">
                      {maxSafeResult.explanation}
                    </p>
                  </div>

                  <div className="p-4 bg-white rounded-xl border border-slate-200 text-right space-y-1">
                    <div className="text-[11px] text-slate-400 font-semibold uppercase">Recommended Return Date</div>
                    <div className="text-lg font-bold text-slate-900 font-mono">
                      {maxSafeResult.recommendedReturnDate || 'N/A'}
                    </div>
                    {maxSafeResult.limitingSubject && (
                      <div className="text-[11px] text-rose-600 font-semibold">
                        Limiting Subject: {maxSafeResult.limitingSubject.subjectName}
                      </div>
                    )}
                  </div>
                </div>
              </div>

              {/* Subject Breakdown at Recommended Date */}
              {maxSafeResult.projections && (
                <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                  <h3 className="font-bold text-sm text-slate-900">
                    Projected Attendance at Recommended Return Date ({maxSafeResult.recommendedReturnDate})
                  </h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 text-slate-600 font-semibold border-b">
                        <tr>
                          <th className="py-2.5 px-3">Subject</th>
                          <th className="py-2.5 px-3">Missed Classes</th>
                          <th className="py-2.5 px-3">Projected %</th>
                          <th className="py-2.5 px-3">Target %</th>
                          <th className="py-2.5 px-3">Remaining Margin Cushion</th>
                          <th className="py-2.5 px-3">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 font-medium">
                        {maxSafeResult.projections.map(p => (
                          <tr key={p.subjectId}>
                            <td className="py-2.5 px-3 font-semibold text-slate-800 flex items-center gap-2">
                              <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: p.color }}></span>
                              {p.subjectName}
                            </td>
                            <td className="py-2.5 px-3 font-mono">{p.expectedMissedClasses}</td>
                            <td className="py-2.5 px-3 font-bold text-slate-900">{p.projectedAttendancePercentage.toFixed(1)}%</td>
                            <td className="py-2.5 px-3 text-slate-500">{p.requiredAttendancePercentage}%</td>
                            <td className="py-2.5 px-3 font-mono">
                              <span className={p.riskMargin >= 0 ? 'text-emerald-600' : 'text-rose-600'}>
                                {p.riskMargin >= 0 ? `+${p.riskMargin.toFixed(1)}%` : `${p.riskMargin.toFixed(1)}%`}
                              </span>
                            </td>
                            <td className="py-2.5 px-3">
                              <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                p.isSafe ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'
                              }`}>
                                {p.isSafe ? 'SAFE' : 'AT RISK'}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 7. TRIP HISTORY VIEW
    // =========================================================================
    function TripHistoryView({ trips, setTrips, showToast, onPlanTrip }) {
      const [selectedTripDetails, setSelectedTripDetails] = useState(null);

      const handleDelete = (id, name) => {
        if (confirm(`Delete trip record "${name}"?`)) {
          setTrips(prev => prev.filter(t => t.id !== id));
          showToast(`Deleted trip "${name}".`, 'info');
        }
      };

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h1 className="text-xl sm:text-2xl font-bold text-slate-900">Saved Trip Projections & Travel History</h1>
              <p className="text-xs sm:text-sm text-slate-500">
                Audit past travel calculations and historical attendance projections.
              </p>
            </div>
            <button
              onClick={onPlanTrip}
              className="flex items-center gap-1.5 bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-sm"
            >
              <i data-lucide="plus" className="w-4 h-4"></i>
              <span>Plan New Trip</span>
            </button>
          </div>

          {trips.length === 0 ? (
            <div className="bg-white rounded-2xl border border-slate-200 p-12 text-center max-w-md mx-auto space-y-3">
              <i data-lucide="calendar-x" className="w-12 h-12 text-slate-300 mx-auto"></i>
              <h3 className="font-bold text-base text-slate-900">No Trips Saved Yet</h3>
              <p className="text-xs text-slate-500">
                Calculate a travel risk in the Trip Planner and click "Save Trip" to preserve it here.
              </p>
            </div>
          ) : (
            <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-50 text-slate-600 font-semibold border-b">
                    <tr>
                      <th className="py-3 px-4">Trip Destination / Name</th>
                      <th className="py-3 px-4">Dates</th>
                      <th className="py-3 px-4">Missed Classes</th>
                      <th className="py-3 px-4">Subject Status</th>
                      <th className="py-3 px-4">Overall Risk</th>
                      <th className="py-3 px-4">Created On</th>
                      <th className="py-3 px-4 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 font-medium">
                    {trips.map(trip => (
                      <tr key={trip.id} className="hover:bg-slate-50/60">
                        <td className="py-3 px-4">
                          <div className="font-bold text-slate-900">{trip.tripName}</div>
                          {trip.notes && <div className="text-[10px] text-slate-400">{trip.notes}</div>}
                        </td>
                        <td className="py-3 px-4 font-mono text-slate-600">
                          {trip.departureDate} → {trip.returnDate}
                        </td>
                        <td className="py-3 px-4">
                          <span className="font-bold text-slate-900">{trip.totalClassesMissed} classes</span>
                        </td>
                        <td className="py-3 px-4">
                          <span className="text-emerald-600 font-semibold">{trip.safeSubjectsCount} Safe</span>
                          {trip.atRiskSubjectsCount > 0 && (
                            <span className="text-rose-600 font-semibold ml-2">• {trip.atRiskSubjectsCount} At Risk</span>
                          )}
                        </td>
                        <td className="py-3 px-4">
                          <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                            trip.overallStatus === 'SAFE'
                              ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                              : 'bg-rose-50 text-rose-700 border border-rose-200'
                          }`}>
                            {trip.overallStatus === 'SAFE' ? 'SAFE' : 'AT RISK'}
                          </span>
                        </td>
                        <td className="py-3 px-4 text-slate-400 text-[11px]">
                          {trip.createdAt ? trip.createdAt.split('T')[0] : 'Recent'}
                        </td>
                        <td className="py-3 px-4 text-right">
                          <div className="flex items-center justify-end gap-2">
                            {trip.projectionDetailsJson && trip.projectionDetailsJson !== '[]' && (
                              <button
                                onClick={() => {
                                  try {
                                    setSelectedTripDetails(JSON.parse(trip.projectionDetailsJson));
                                  } catch (e) {
                                    alert('Snapshot details not available');
                                  }
                                }}
                                className="text-brand-600 hover:text-brand-800 p-1 font-semibold"
                                title="View Saved Breakdown"
                              >
                                View Snapshot
                              </button>
                            )}
                            <button
                              onClick={() => handleDelete(trip.id, trip.tripName)}
                              className="text-slate-400 hover:text-rose-600 p-1"
                              title="Delete Record"
                            >
                              <i data-lucide="trash-2" className="w-4 h-4"></i>
                            </button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* Snapshot Modal */}
          {selectedTripDetails && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-slate-200 space-y-4 max-h-[80vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-base text-slate-900">Historical Projection Snapshot</h3>
                  <button onClick={() => setSelectedTripDetails(null)} className="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-50 text-slate-600 font-semibold border-b">
                    <tr>
                      <th className="py-2 px-3">Subject</th>
                      <th className="py-2 px-3">Missed</th>
                      <th className="py-2 px-3">Projected %</th>
                      <th className="py-2 px-3">Status</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {selectedTripDetails.map((p, idx) => (
                      <tr key={idx}>
                        <td className="py-2 px-3 font-semibold text-slate-800">{p.subjectName}</td>
                        <td className="py-2 px-3 font-mono">{p.expectedMissedClasses}</td>
                        <td className="py-2 px-3 font-bold">{p.projectedAttendancePercentage?.toFixed(1) || p.projectedAttendancePercentage}%</td>
                        <td className="py-2 px-3">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                            p.status === 'SAFE' || p.isSafe ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'
                          }`}>
                            {p.status || (p.isSafe ? 'SAFE' : 'AT RISK')}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>

                <div className="flex justify-end pt-2 border-t">
                  <button
                    onClick={() => setSelectedTripDetails(null)}
                    className="px-4 py-2 bg-slate-800 text-white font-semibold text-xs rounded-xl"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 8. SETTINGS & PROFILE VIEW
    // =========================================================================
    function SettingsView({ profile, setProfile, backendOnline, onCheckBackend, onResetDemo, onClearAll, showToast }) {
      const [name, setName] = useState(profile.name);
      const [roll, setRoll] = useState(profile.rollNumber);
      const [college, setCollege] = useState(profile.collegeName);
      const [hostel, setHostel] = useState(profile.hostelBlock);
      const [minAtt, setMinAtt] = useState(profile.defaultMinAttendance);

      const handleSaveProfile = (e) => {
        e.preventDefault();
        const updated = {
          name: name.trim(),
          rollNumber: roll.trim(),
          collegeName: college.trim(),
          hostelBlock: hostel.trim(),
          defaultMinAttendance: parseFloat(minAtt) || 75
        };
        setProfile(updated);
        showToast('Profile and preferences updated!', 'success');
      };

      return (
        <div className="space-y-6 max-w-4xl mx-auto">
          {/* Header */}
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <h1 className="text-xl sm:text-2xl font-bold text-slate-900">Student Profile & System Settings</h1>
            <p className="text-xs sm:text-sm text-slate-500">Configure hostel details, default threshold values, and demo storage.</p>
          </div>

          {/* Student Profile Form */}
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <h3 className="font-bold text-base text-slate-900 border-b pb-3">Student & Hostel Information</h3>
            <form onSubmit={handleSaveProfile} className="space-y-4 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Full Name</label>
                  <input
                    type="text"
                    value={name}
                    onChange={e => setName(e.target.value)}
                    className="w-full px-3.5 py-2.5 border rounded-xl border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500"
                  />
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Roll / Student ID</label>
                  <input
                    type="text"
                    value={roll}
                    onChange={e => setRoll(e.target.value)}
                    className="w-full px-3.5 py-2.5 border rounded-xl border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500"
                  />
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">College / University</label>
                  <input
                    type="text"
                    value={college}
                    onChange={e => setCollege(e.target.value)}
                    className="w-full px-3.5 py-2.5 border rounded-xl border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500"
                  />
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Hostel Block & Room No.</label>
                  <input
                    type="text"
                    value={hostel}
                    onChange={e => setHostel(e.target.value)}
                    className="w-full px-3.5 py-2.5 border rounded-xl border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500"
                  />
                </div>
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Default Mandatory Minimum Attendance (%)</label>
                <input
                  type="number"
                  min="50"
                  max="100"
                  value={minAtt}
                  onChange={e => setMinAtt(e.target.value)}
                  className="w-full sm:w-48 px-3.5 py-2.5 border rounded-xl border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
              </div>

              <div className="pt-2">
                <button
                  type="submit"
                  className="bg-brand-600 hover:bg-brand-700 text-white font-semibold px-4 py-2.5 rounded-xl shadow-sm text-xs"
                >
                  Save Profile Settings
                </button>
              </div>
            </form>
          </div>

          {/* Backend Connection Diagnostic Card */}
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <h3 className="font-bold text-base text-slate-900 border-b pb-3">Backend Integration Status</h3>
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 text-xs">
              <div className="space-y-1">
                <div className="flex items-center gap-2">
                  <span className={`w-3 h-3 rounded-full ${backendOnline ? 'bg-emerald-500' : 'bg-blue-500'}`}></span>
                  <span className="font-bold text-slate-800">
                    {backendOnline ? 'Spring Boot REST API is Online (Port 8080)' : 'Client-Side Engine Active (Backend Offline)'}
                  </span>
                </div>
                <p className="text-slate-500 text-[11px] leading-relaxed">
                  {backendOnline
                    ? 'Requests are persistently processed through Spring Boot REST controllers and the relational repository layer.'
                    : 'The client-side mathematical engine is running identical calculations locally in compliance with the verified formulas.'}
                </p>
              </div>

              <button
                onClick={onCheckBackend}
                className="flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold px-4 py-2 rounded-xl border border-slate-200"
              >
                <i data-lucide="refresh-cw" className="w-3.5 h-3.5"></i>
                <span>Test Connection</span>
              </button>
            </div>
          </div>

          {/* Data Reset & Demo Controls */}
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <h3 className="font-bold text-base text-slate-900 border-b pb-3">Data Management & Reset Controls</h3>
            <div className="flex flex-col sm:flex-row gap-4">
              <div className="flex-1 p-4 rounded-xl border border-slate-200 bg-slate-50/60 space-y-2">
                <h4 className="font-bold text-sm text-slate-800">Reload Sample Demo Data</h4>
                <p className="text-xs text-slate-500">
                  Resets the application with the verified college dataset (CS subjects, timetable, and sample holidays).
                </p>
                <button
                  onClick={onResetDemo}
                  className="bg-brand-600 hover:bg-brand-700 text-white font-semibold px-3.5 py-2 rounded-xl text-xs"
                >
                  Reload Demo Data
                </button>
              </div>

              <div className="flex-1 p-4 rounded-xl border border-rose-200 bg-rose-50/40 space-y-2">
                <h4 className="font-bold text-sm text-rose-900">Clear All Workspace Data</h4>
                <p className="text-xs text-slate-500">
                  Deletes all subjects, timetable entries, registered holidays, and trip history.
                </p>
                <button
                  onClick={onClearAll}
                  className="bg-rose-600 hover:bg-rose-700 text-white font-semibold px-3.5 py-2 rounded-xl text-xs"
                >
                  Clear All Data
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render root application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
