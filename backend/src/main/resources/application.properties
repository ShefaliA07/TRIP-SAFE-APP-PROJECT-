# ===================================================================
# TripSafe Backend Configuration - Default Development Profile (H2 DB)
# ===================================================================
server.port=8080
spring.application.name=tripsafe-backend

# File-based H2 database for persistent development without requiring external database installation
spring.datasource.url=jdbc:h2:file:./data/tripsafedb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console for interactive database inspection at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging
logging.level.com.tripsafe=INFO
