# ===================================================================
# TripSafe Backend Configuration - Production / MySQL Profile
# Activate via: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# ===================================================================
server.port=8080
spring.application.name=tripsafe-backend

# MySQL Connection Details
spring.datasource.url=jdbc:mysql://localhost:3306/tripsafe_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=password

# JPA and Hibernate configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
